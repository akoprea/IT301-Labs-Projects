<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 11</title>
    <style>
        #box {
            background-color: blue;
            color:white;
            font-size: 1.2em;
            width:100px;
            padding:3px; 
            border: 2px solid black;
            border-radius: 10px; 
            text-align: center;
            user-select: none; /* no text select */
        }
        #box:hover {
            cursor:pointer; 
        }
    </style>
</head>
<body>
    <div id="box">Click Me!</div>
    <div id="other" style="height:75vh;"></div>

    <script>
        const box = document.getElementById("box"); 

        // hover
        box.addEventListener('mouseover', function(){
            box.textContent = "Do not click! 😠";
            box.style.backgroundColor = "yellow";
        }); 
        // click
        box.addEventListener('click', function(){
            box.textContent = "Ouch! 🤕";
            box.style.backgroundColor = "red";
        }); 
        // stop hover
        box.addEventListener('mouseleave', function(){
            box.textContent = "Phew! 😌";
            box.style.backgroundColor = "lightgreen";
        }); 
        // double click
        box.addEventListener('dblclick', function(){
            box.textContent = "Double trouble! 🤩";
            box.style.backgroundColor = "pink";
        }); 
        
        // 
        const other = document.getElementById("other");
        other.addEventListener('mousemove', function(){
            box.textContent = "I see you! 👀";
            box.style.backgroundColor = "lightblue";
        }); 
        
    </script>
</body>
</html>
